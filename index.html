<!DOCTYPE html>
<!-- v4 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damiani Investments, LLC</title>
  <meta name="description" content="Damiani Investments, LLC. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f7f7f5;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 1.75rem 3rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      background: #4F46E5;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: #111;
      letter-spacing: -0.01em;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem 4rem;
      text-align: center;
      animation: fadeUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Pill badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #ede9fe;
      color: #4F46E5;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.38rem 0.9rem;
      border-radius: 100px;
      margin-bottom: 2.25rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #4F46E5;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    /* Coming soon card */
    .coming-soon-card {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      background: #fff;
      border: 1.5px solid #e8e8e6;
      border-radius: 14px;
      padding: 0.85rem 1.5rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: #444;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .coming-soon-card .icon {
      font-size: 1.1rem;
    }

    /* ── Footer ── */
    footer {
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-top: 1px solid #e8e8e6;
      font-size: 0.75rem;
      color: #bbb;
    }

    /* ── Animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header { padding: 1.25rem 1.5rem; }
      footer  { padding: 1.25rem 1.5rem; }
      main    { padding: 4rem 1.5rem 3rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark">DI</div>
    <span class="brand-name">Damiani Investments</span>
  </header>

  <main>

    <div class="badge">
      <span class="badge-dot"></span>
      Coming Soon
    </div>

    <div class="coming-soon-card">
      <span class="icon">👋</span>
      <span>Something good is on the way — check back soon.</span>
    </div>

  </main>

  <footer>
    <span>&copy; 2026 Damiani Investments, LLC</span>
  </footer>

</body>
</html>
